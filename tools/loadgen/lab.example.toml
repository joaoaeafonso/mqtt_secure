# Load-lab configuration. Every key is optional; missing keys use these defaults.
# All settings can be changed while the lab runs (dashboard or POST /api/config)
# except the ones marked "startup only".

[broker]
host = "127.0.0.1"         # startup only; bind address. "0.0.0.0" when agents run elsewhere
port = 18830               # startup only; a private Mosquitto, the system one is left alone
advertise = ""             # startup only; address clients use (default: host, or this
                           # machine's LAN address when host is 0.0.0.0). Goes in the
                           # broker certificate, so TLS hostname checks pass.

[transport]                # defence layer 1: the broker and the connections to it
mode = "plain"             # plain | tls | mtls   (mtls: client certificates, CN = username)
tls_version = "1.2"        # 1.2 | 1.3 (tls and mtls; restarts the broker)
protocol = "3.1.1"         # 3.1.1 | 5   MQTT version of every client (reconnects them)
auth = false               # username/password required
acl = true                 # open/ for everyone, restricted/ per client. Off = no ACL at all
clientid_binding = false   # client id := username, so no client can take over another's
                           # session by reusing its client id (restarts the broker)
sys_topics = false         # publish $SYS/# broker statistics (readable by all without ACL)
max_packet = 0             # bytes; larger packets disconnect the sender. 0 = no limit
max_connections = 0        # broker-wide connection limit. 0 = no limit

[payload]                  # defence layer 2: end to end, sensor <-> gateway
protection = "encrypt"     # none | auth_only | encrypt | sign (Ed25519: proof of origin)
freshness = true           # reject messages older than 60 s
replay = true              # sequence-number replay window
key_binding = true         # a key may only publish on its owner's topics (+/sensors/<owner>/#)
rate_limit = 0             # gateway: inbound msg/s per topic, 0 = off
key_epoch = 0              # raise it while running to rotate every payload key
                           # (old keys are revoked 3 s later); never goes back

[storage]
persistence = "none"       # none | plain (decrypted) | at-rest (envelopes)

[downlink]
rate = 0                   # gateway -> actuator commands/s (each sensor is an actuator)

[response]
revoked = ""               # while running: "3,7" withdraws sensor-3 and sensor-7's payload
                           # keys, passwords and certificates (CRL). Permanent for the run.

[load]
sensors = 50               # startup only
processes = 2              # startup only; Python worker processes
qos = 0                    # startup only; 0 | 1 | 2
rate = 20                  # msg/s per sensor
payload = 64               # plaintext bytes, min 8
zone = "restricted"        # open | restricted

[attacker]
enabled = true             # subscribes to '#'; has only the public CA certificate
impersonate = false        # claim username "gateway" (no password, no certificate)
inject_rate = 0            # forged plaintext msg/s into sensor-1's topic
replay_rate = 0            # captured messages re-published per second

[cluster]                  # startup only: sensors/attackers on other machines
sensor_agents = 0          # 0 = sensors run here; N = wait for N agents, split sensors evenly
attacker_agents = 0        # 0 = one attacker here; N = one attacker per agent machine
listen = "0.0.0.0"         # control port agents connect to (TLS, token + pinned certificate)
port = 8089
join_timeout = 600         # seconds to wait for the agents before giving up
